[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-lens"
version = "0.2.0"
description = "Invisible Prompt Observation Engine (Zero-Dependency, Deterministic)"
readme = "README.md"
authors = [
    { name = "Kai IWASAKI" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Text Processing :: Filters"
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/neguseatama/sieve-lens"
Repository = "https://github.com/neguseatama/sieve-lens.git"
"Bug Tracker" = "https://github.com/neguseatama/sieve-lens/issues"

[tool.setuptools]
py-modules = ["sieve_lens"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
all = ["pypdf>=4.0"]