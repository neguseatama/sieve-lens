[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-lens"
version = "0.8.0"
description = "Invisible Prompt Observation Engine (Zero-Dependency, Deterministic)"
readme = "README.md"
authors = [
    { name = "Kai IWASAKI" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Text Processing :: Filters"
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/neguseatama/sieve-lens"
Repository = "https://github.com/neguseatama/sieve-lens.git"
"Bug Tracker" = "https://github.com/neguseatama/sieve-lens/issues"

[tool.setuptools]
py-modules = ["sieve_lens"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
ocr = ["Pillow>=10.0", "pytesseract>=0.3.10"]
html-css = ["tinycss2>=1.1"]
html-css-full = ["tinycss2>=1.1", "cssselect2>=0.7"]
dashboard = ["Jinja2>=3.0", "Plotly>=5.0"]
pdf-report = ["weasyprint>=60.0", "Jinja2>=3.0", "Plotly>=5.0", "kaleido>=0.2"]
all = [
    "pypdf>=4.0",
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
    "tinycss2>=1.1",
    "cssselect2>=0.7",
    "Jinja2>=3.0",
    "Plotly>=5.0",
    "weasyprint>=60.0",
    "kaleido>=0.2",
]