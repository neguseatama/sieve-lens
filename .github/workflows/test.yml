name: Sieve Lens CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    name: Run Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Core Test Suite (zero-dependency)
      run: |
        python -m unittest discover -s tests -p "test_sieve_lens.py" -v
        python -m unittest discover -s tests -p "test_sieve_lens_v0_1.py" -v

    - name: Install PDF extension
      run: |
        python -m pip install pypdf

    - name: Run PDF Extension Test Suite
      run: |
        python -m unittest discover -s tests -p "test_sieve_lens_pdf.py" -v

    - name: Install OCR extension (system + Python)
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr
        python -m pip install Pillow pytesseract

    - name: Run OCR Extension Test Suite
      run: |
        python -m unittest discover -s tests -p "test_sieve_lens_ocr.py" -v

    - name: Install HTML CSS extension
      run: |
        python -m pip install tinycss2

    - name: Run HTML CSS Extension Test Suite
      run: |
        python -m unittest discover -s tests -p "test_sieve_lens_html_css.py" -v
